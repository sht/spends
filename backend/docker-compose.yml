services:
  backend:
    image: tajii/spends-tracker:latest
    container_name: spends_tracker
    ports:
      - '3031:8000'
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/spends_tracker.db
      - UPLOADS_DIR=/app/data/uploads
      - HOST=0.0.0.0
      - PORT=8000
      - TZ=Europe/Berlin
    volumes:
      - /mnt/ironwolf8tb/spends:/app/data
    restart: unless-stopped
